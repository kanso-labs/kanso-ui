name: Chromatic

on: push

permissions:
  contents: read
  statuses: write

jobs:
  chromatic:
    name: Run visual regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1
        with:
          # Chromatic reads the full history to work out which commits it has
          # already snapshotted, and treats a shallow clone as a new baseline.
          fetch-depth: 0

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v2.0.0
        with:
          ignore-scripts: true

      - name: Run Chromatic
        uses: chromaui/action@v18.3.0
        with:
          exitOnceUploaded: true
          onlyChanged: true
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

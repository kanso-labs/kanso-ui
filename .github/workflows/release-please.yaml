name: Release Please

on:
  push:
    branches:
      - main

# Every release merge pushes main, and every push starts a run. Overlapping runs
# try to cut the same tags and strip the same labels, and one dies on the
# other's half-finished work. Do not add cancel-in-progress: the last push must
# still get a run, or the release it carries is never proposed.
#
# This belongs to the caller. GitHub documents concurrency there and says
# nothing either way about a group declared inside a called workflow.
concurrency:
  cancel-in-progress: false
  group: release-please

# Wider than home-assistant-applications needs, because this repository has no
# application token yet and the shared workflow therefore falls back to
# GITHUB_TOKEN, which has to do the writing itself. Once the secrets below
# exist, this can drop to contents: read.
permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  # These two secrets do not exist in this repository yet. That is not a
  # mistake and it does not fail the run: the shared workflow treats both as
  # optional, and an unset secret arrives as an empty string, which selects its
  # GITHUB_TOKEN fallback and prints a warning saying so.
  #
  # The fallback is not a working release process here, and it never was. A
  # pull request opened with GITHUB_TOKEN starts no workflow runs, so the
  # release pull request never starts Build, Lint or Test — the three checks
  # this repository's ruleset requires to merge it. That is why #11 has sat
  # open and unmergeable since October 2025.
  #
  # Installing the app that home-assistant-applications already uses and adding
  # its two secrets is what fixes that, and needs no change to this file.
  release-please:
    name: Propose releases
    uses: kanso-labs/github-actions/.github/workflows/_release-please.yaml@v1.2.0
    secrets:
      app-id: ${{ secrets.RELEASE_PLEASE_APP_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

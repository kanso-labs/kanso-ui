name: Release Please

on:
  push:
    branches:
      - main
  # Releases are batched to one a day rather than one per merge. The push above
  # keeps the release pull request current — its changelog and its version
  # always reflect main — and this is the only trigger that turns merging on,
  # through the auto-merge input below.
  #
  # 12:15 UTC is 09:15 America/Sao_Paulo. Every kanso-labs repository releases
  # on this same cron, which matters here more than most: this repository
  # devDepends on @kanso-labs/unplugin-style-dictionary, so a change spanning
  # the two comes out in one morning rather than being a day apart.
  #
  # GitHub disables a scheduled workflow after 60 days without repository
  # activity. Renovate's commits keep this one alive, but that is the shape a
  # silent stop to releasing would take.
  schedule:
    - cron: '15 12 * * *'
  # Neither trigger above can be asked to look again now: one waits for a push,
  # the other for the clock. That matters when a release pull request has to be
  # discarded, because release-please rewrites one only when the release it
  # computes changes — so a pull request that cannot merge, say one opened
  # before the application was installed whose required checks were never
  # started and never will be, is not repaired by closing it. Nothing proposes a
  # replacement until somebody happens to push. This is that lever.
  #
  # Dispatched on a tag instead of main, it publishes that tag, which is how a
  # version that did not publish is recovered: Run workflow, then the tag under
  # "Use workflow from". The publish skips a registry that already has it.
  workflow_dispatch:
  # Publishing starts from the release, not from the run that cut it. The run
  # that cuts a release need not be the release commit's own: a push landing
  # while that run waits replaces it in the concurrency group, and the later
  # run's checkout is a later commit, which is how v0.49.0 nearly went out
  # unpublished (kanso-labs/actions#123). release-please tags the release
  # commit whichever run cuts it, and the release event runs on that tag. It
  # fires because the application token creates the release, as
  # deploy-storybook.yaml already relies on.
  release:
    types:
      - published

# Every release merge pushes main, and every push starts a run. Overlapping runs
# try to cut the same tags and strip the same labels, and one dies on the
# other's half-finished work. Do not add cancel-in-progress: the last push must
# still get a run, or the release it carries is never proposed.
#
# This belongs to the caller. GitHub documents concurrency there and says
# nothing either way about a group declared inside a called workflow.
#
# A run on a tag takes a group of its own. In the shared one it would be one
# more pending run a push could replace, which is the bug above one step later;
# keyed on the tag, two runs for one version queue, and the second finds it
# published.
concurrency:
  cancel-in-progress: false
  group:
    ${{ github.ref_type == 'tag' && format('publish-{0}', github.ref_name) ||
    'release-please' }}

# The application token below does the writing, so GITHUB_TOKEN stays on read.
permissions:
  contents: read

jobs:
  release-please:
    name: Propose releases
    if: github.ref_type != 'tag'
    uses: kanso-labs/actions/.github/workflows/_release-please.yaml@v4.6.0
    with:
      # True only on the scheduled run, which is what batches a day of merges
      # into one release. A push proposes without merging, and so does
      # workflow_dispatch — the lever above re-proposes a stuck release pull
      # request rather than releasing on demand. To publish sooner than the next
      # scheduled run, enable auto-merge on the pull request by hand.
      #
      # v3.2.0 is the floor for this. Before it, auto-merge read the action's
      # prs output, which is empty on a run that finds the release pull request
      # already correct — the scheduled run's ordinary case, so an older pin
      # here would propose every day and merge on none of them.
      auto-merge: ${{ github.event_name == 'schedule' }}
    secrets:
      client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  # Trusted publishing, so there is no npm token in this repository. The first
  # publish cannot use it: npm configures a trusted publisher on the package
  # page, and the package has to exist before there is a page to configure. So
  # @kanso-labs/kanso-ui had to be pushed by hand once, after which this took
  # over. @kanso-labs/unplugin-style-dictionary was bootstrapped the same way —
  # its 0.2.1 carries a human _npmUser and no provenance attestation.
  #
  # The four steps this used to spell out — check out, set up Node, build,
  # publish — now live in the shared workflow, which unplugin-style-dictionary
  # calls as well. Its ignore-scripts default is true, which is what keeps the
  # prepare script from downloading Playwright's browsers twice: once on
  # install, and once as a step of the publish itself, where failing to fetch a
  # browser would abort a release that has already been tagged.
  #
  # That workflow publishes the same tarball twice: to npmjs.com over trusted
  # publishing, then to GitHub Packages. One call, two jobs, and the second only
  # runs if the first did — so the organization's registry never carries a
  # version npmjs.com has not got.
  #
  # It runs only on a tag: the release event, or a dispatch on the tag. The
  # shared workflow checks out the tag, refuses a commit that is not on main,
  # and publishes nothing to a registry that already has the version, so
  # running it twice is safe.
  publish:
    name: Publish to npm
    if: github.ref_type == 'tag'
    # Three scopes for two registries. npm exchanges id-token for a short-lived
    # credential and mints a provenance attestation off the same token; GitHub
    # Packages has no trusted publishing at all and takes GITHUB_TOKEN with
    # packages: write instead. Granted here rather than at the top of the file
    # because this job is the only thing that needs any of them.
    #
    # The called workflow splits them across its two jobs and neither job holds
    # the other's, which is why all three are named here rather than the two
    # npm alone would need. A caller is checked against each job it starts, so
    # a scope left out fails the run immediately with that scope named rather
    # than being refused by a registry.
    #
    # packages: write landed here before the pin below moved to a version that
    # has the GitHub Packages job, and that order is not optional: a caller
    # granting less than a called job asks for fails outright, while a caller
    # granting more than it asks for is fine. Renovate's bump of the pin is what
    # turns the second registry on.
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: kanso-labs/actions/.github/workflows/_publish-npm.yaml@v4.6.0

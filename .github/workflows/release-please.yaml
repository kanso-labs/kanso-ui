name: Release Please

on:
  push:
    branches:
      - main
  # release-please only ever reacts to a push, which leaves no way to ask it to
  # look again. That matters when a release pull request has to be discarded:
  # release-please rewrites one only when the release it computes changes, so a
  # pull request that cannot merge — say, one opened before the application was
  # installed, whose required checks were never started and never will be — is
  # not repaired by closing it. Nothing proposes a replacement until somebody
  # happens to push. This is that lever.
  workflow_dispatch:

# Every release merge pushes main, and every push starts a run. Overlapping runs
# try to cut the same tags and strip the same labels, and one dies on the
# other's half-finished work. Do not add cancel-in-progress: the last push must
# still get a run, or the release it carries is never proposed.
#
# This belongs to the caller. GitHub documents concurrency there and says
# nothing either way about a group declared inside a called workflow.
concurrency:
  cancel-in-progress: false
  group: release-please

# The application token below does the writing, so GITHUB_TOKEN stays on read.
permissions:
  contents: read

jobs:
  release-please:
    name: Propose releases
    uses: kanso-labs/github-actions/.github/workflows/_release-please.yaml@v2.1.0
    secrets:
      client-id: ${{ secrets.RELEASE_PLEASE_CLIENT_ID }}
      private-key: ${{ secrets.RELEASE_PLEASE_PRIVATE_KEY }}

  # Trusted publishing, so there is no npm token in this repository. The first
  # publish cannot use it: npm configures a trusted publisher on the package
  # page, and the package has to exist before there is a page to configure. So
  # @kanso-labs/kanso-ui had to be pushed by hand once, after which this took
  # over. @kanso-labs/unplugin-style-dictionary was bootstrapped the same way —
  # its 0.2.1 carries a human _npmUser and no provenance attestation.
  #
  # The four steps this used to spell out — check out, set up Node, build,
  # publish — now live in the shared workflow, which unplugin-style-dictionary
  # calls as well. Its ignore-scripts default is true, which is what keeps the
  # prepare script from downloading Playwright's browsers twice: once on
  # install, and once as a step of the publish itself, where failing to fetch a
  # browser would abort a release that has already been tagged.
  #
  # That workflow publishes the same tarball twice: to npmjs.com over trusted
  # publishing, then to GitHub Packages. One call, two jobs, and the second only
  # runs if the first did — so the organization's registry never carries a
  # version npmjs.com has not got.
  publish:
    name: Publish to npm
    needs: release-please
    # Compared against the string rather than used bare. A bare truthiness test
    # would also pass on the string "false", which is what this output carries
    # when release-please runs and decides not to cut a release.
    if: needs.release-please.outputs.release_created == 'true'
    # Three scopes for two registries. npm exchanges id-token for a short-lived
    # credential and mints a provenance attestation off the same token; GitHub
    # Packages has no trusted publishing at all and takes GITHUB_TOKEN with
    # packages: write instead. Granted here rather than at the top of the file
    # because this job is the only thing that needs any of them.
    #
    # The called workflow splits them across its two jobs and neither job holds
    # the other's, which is why all three are named here rather than the two
    # npm alone would need. A caller is checked against each job it starts, so
    # a scope left out fails the run immediately with that scope named rather
    # than being refused by a registry.
    #
    # packages: write landed here before the pin below moved to a version that
    # has the GitHub Packages job, and that order is not optional: a caller
    # granting less than a called job asks for fails outright, while a caller
    # granting more than it asks for is fine. Renovate's bump of the pin is what
    # turns the second registry on.
    permissions:
      contents: read
      id-token: write
      packages: write
    uses: kanso-labs/github-actions/.github/workflows/_publish-npm.yaml@v2.1.0

name: Build

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Skips the prepare script, which downloads Playwright's browsers. Only
      # the Test job needs those; here they are a few hundred megabytes to
      # build a library with.
      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.3.0
        with:
          ignore-scripts: true

      - name: Run build
        run: npm run build

      # publint reads package.json and the packed file list, so it catches an
      # exports target that points at a file the tarball does not carry.
      # check-package.mjs covers the two failures it reports as "All good!" —
      # the comment at the top of that script says which and why.
      - name: Verify the published package shape
        run: npm run package:check

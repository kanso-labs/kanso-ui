name: Lint

on: pull_request

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v2.0.0
        with:
          ignore-scripts: true

      - name: Run lint
        run: npm run lint

name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Before the install, so a broken workflow fails in a few seconds rather
      # than after npm ci. It is also a step of this job rather than a job of
      # its own, because Lint is a context the ruleset requires and a new job
      # would be a new name nothing requires — free to fail without stopping
      # anything.
      #
      # .github/actionlint.yaml carries the one suppression this repository
      # needs; see the comment in that file.
      - name: Run actionlint
        uses: kanso-labs/github-actions/actions/lint-workflows@v3.0.1

      - name: Set up Node
        uses: kanso-labs/github-actions/actions/setup-node@v3.0.1
        with:
          ignore-scripts: true

      - name: Run lint
        run: npm run lint

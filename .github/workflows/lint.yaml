name: Lint

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# Three pushes to a branch inside a minute otherwise run three Lints to
# completion, and only the last one is answering a question anybody is asking:
# a pull request's check list shows the head commit alone. Grouped per workflow
# and ref, so Lint never waits on Build or Test and one branch never waits on
# another.
#
# cancel-in-progress is on everywhere except main, where each push is the
# repository re-verifying what it just merged rather than iterating towards a
# review.
concurrency:
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
  group: lint-${{ github.ref }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      # Before the install, so a broken workflow fails in a few seconds rather
      # than after npm ci. It is also a step of this job rather than a job of
      # its own, because Lint is a context the ruleset requires and a new job
      # would be a new name nothing requires — free to fail without stopping
      # anything.
      #
      # .github/actionlint.yaml carries the one suppression this repository
      # needs; see the comment in that file.
      - name: Run actionlint
        uses: kanso-labs/actions/lint-workflows@v4.0.1

      - name: Set up Node
        uses: kanso-labs/actions/setup-node@v4.0.1
        with:
          ignore-scripts: true

      - name: Run lint
        run: npm run lint

# Codecov looks for this file under the name codecov.yml or .codecov.yml, in
# the repository root, dev/ or .github/, and nowhere else. The .yaml spelling
# every other YAML file in this repository uses is not one it recognises, so
# this filename is a deliberate exception to that convention rather than an
# oversight — renaming it to codecov.yaml silently restores the defaults below.
#
# Both statuses are informational because nothing here gates on coverage.
# Codecov's default project status fails when a pull request lowers coverage by
# any amount at all, which would put a red cross on pull requests against a
# threshold nobody agreed to. informational keeps the number reported and the
# status green.
coverage:
  status:
    patch:
      default:
        informational: true
    project:
      default:
        informational: true
